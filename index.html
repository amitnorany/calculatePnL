<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כמה זה עולה לי? 💎</title>
    <!-- Tailwind CSS לעיצוב מודרני ונקי -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 text-slate-800 min-h-screen pb-20">

    <!-- כותרת ראשית -->
    <header class="bg-sky-600 text-white py-4 text-center shadow-md">
        <h1 class="text-2xl font-bold">כמה זה עולה לי? 💎</h1>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- === טאב 1: מנויים והוצאות === -->
        <section id="tab-subs" class="space-y-4">
            <!-- כרטיסיית סיכום -->
            <div class="bg-sky-500 text-white rounded-2xl p-5 shadow">
                <p class="text-sky-100 text-sm text-center">סך ההוצאה הקבועה</p>
                <div class="flex justify-around my-3">
                    <div class="text-center">
                        <span class="text-sky-200 text-xs block">חודשי</span>
                        <span id="total-monthly" class="text-2xl font-bold">₪0.0</span>
                    </div>
                    <div class="text-center">
                        <span class="text-sky-200 text-xs block">שנתי</span>
                        <span id="total-yearly" class="text-2xl font-bold">₪0.0</span>
                    </div>
                </div>
                <p id="wage-impact" class="text-yellow-200 text-center text-xs font-medium mt-2"></p>
            </div>

            <!-- טופס הוספת מנוי -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-sky-800 mb-3">הוספת מנוי חדש</h2>
                <input type="text" id="sub-name" placeholder="שם המנוי (למשל: Netflix)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 mb-2 text-right">
                <div class="flex gap-2 mb-3">
                    <input type="number" id="sub-price" placeholder="מחיר" class="flex-1 bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-right">
                    <select id="sub-currency" class="bg-slate-100 border border-slate-200 rounded-lg px-3 font-bold text-slate-600">
                        <option value="ILS">₪</option>
                        <option value="USD">$</option>
                        <option value="EUR">€</option>
                    </select>
                    <select id="sub-cycle" class="bg-slate-100 border border-slate-200 rounded-lg px-2 text-xs font-bold text-slate-600">
                        <option value="monthly">חודשי</option>
                        <option value="yearly">שנתי</option>
                    </select>
                </div>
                <button onclick="addSubscription()" class="w-full bg-sky-600 text-white font-bold py-2.5 rounded-lg shadow hover:bg-sky-700 transition">+ הוסף מנוי</button>
            </div>

            <!-- רשימת מנויים פעילים -->
            <div>
                <h3 id="active-subs-title" class="font-bold text-slate-900 mb-2">מנויים פעילים (0)</h3>
                <div id="active-subs-list" class="space-y-2"></div>
            </div>

            <!-- רשימת מנויים מבוטלים -->
            <div id="cancelled-container" class="mt-6 hidden">
                <h3 id="cancelled-subs-title" class="font-bold text-slate-500 mb-2 text-sm">מנויים מבוטלים / בהפוגה (0)</h3>
                <div id="cancelled-subs-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- === טאב 2: דוכנים ומכירות === -->
        <section id="tab-projects" class="space-y-4 hidden">
            <button onclick="openProjectModal()" class="w-full bg-sky-600 text-white font-bold py-2.5 rounded-lg shadow hover:bg-sky-700 transition">+ יצירת פרויקט / דוכן חדש</button>
            <div id="projects-list" class="space-y-4"></div>
        </section>

        <!-- === טאב 3: פרופיל ושכר === -->
        <section id="tab-profile" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-sky-800 mb-3">הגדרות חשבון ושכר</h2>
                <label class="text-sm text-slate-600 block mb-1">סוג השכר / הכנסה:</label>
                <button onclick="setWageType('monthly')" id="btn-monthly" class="w-full p-2.5 rounded-lg mb-2 text-sm font-bold bg-sky-600 text-white">שכר חודשי נטו (שכירים/מבוגרים)</button>
                <button onclick="setWageType('hourly')" id="btn-hourly" class="w-full p-2.5 rounded-lg mb-4 text-sm font-bold bg-slate-100 text-slate-700">שכר שעתי (צעירים/שעתי)</button>
                
                <label id="wage-label" class="text-sm text-slate-600 block mb-1">סכום משכורת חודשית (₪) (נטו):</label>
                <input type="number" id="wage-amount" oninput="updateWage(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-right" value="12000">
            </div>
        </section>

    </main>

    <!-- ניווט תחתון -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-3 shadow-lg z-10">
        <button onclick="switchTab('subs')" id="nav-subs" class="text-sky-600 font-bold text-sm flex flex-col items-center">💳 מנויים</button>
        <button onclick="switchTab('projects')" id="nav-projects" class="text-slate-500 font-medium text-sm flex flex-col items-center">⛺ דוכנים ומכירות</button>
        <button onclick="switchTab('profile')" id="nav-profile" class="text-slate-500 font-medium text-sm flex flex-col items-center">⚙️ פרופיל</button>
    </nav>

    <!-- מודאל יצירת פרויקט -->
    <div id="project-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm">
            <h3 class="text-lg font-bold text-sky-800 mb-3">יצירת פרויקט / דוכן חדש</h3>
            <input type="text" id="new-proj-title" placeholder="שם הפרויקט" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 mb-3 text-right">
            
            <label class="text-sm text-slate-600 block mb-1">סוג המכירה:</label>
            <div class="flex gap-2 mb-4">
                <button onclick="setProjType('paid')" id="proj-type-paid" class="flex-1 p-2 rounded-lg text-xs font-bold bg-sky-600 text-white">קנייה ומכירת סחורה</button>
                <button onclick="setProjType('free')" id="proj-type-free" class="flex-1 p-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-700">מכירת חצר / 0₪ עלות</button>
            </div>

            <div class="flex gap-2">
                <button onclick="createProject()" class="flex-1 bg-sky-600 text-white font-bold py-2 rounded-lg">צור פרויקט</button>
                <button onclick="closeProjectModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2 rounded-lg">ביטול</button>
            </div>
        </div>
    </div>

    <!-- מודאל אישור מעוצב (Custom Alert Modal) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center">
            <div class="text-3xl mb-2">⚠️</div>
            <h3 id="confirm-title" class="text-lg font-bold text-slate-800 mb-1"></h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-5"></p>
            <div class="flex gap-2">
                <button id="confirm-btn" class="flex-1 text-white font-bold py-2.5 rounded-lg shadow transition">אישור</button>
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-lg">ביטול</button>
            </div>
        </div>
    </div>

    <!-- סקריפט ניהול הלוגיקה -->
    <script>
        let state = {
            activeTab: 'subs',
            exchangeRates: { ILS: 1, USD: 3.7, EUR: 4.0 },
            wageType: 'monthly',
            wageAmount: '12000',
            subscriptions: [],
            projects: [],
            newProjType: 'paid'
        };

        let confirmCallback = null;

        function showConfirm(title, message, onConfirmAction, confirmText = 'אישור', confirmColor = 'bg-red-500 hover:bg-red-600') {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            const btn = document.getElementById('confirm-btn');
            btn.innerText = confirmText;
            btn.className = `flex-1 text-white font-bold py-2.5 rounded-lg shadow transition ${confirmColor}`;
            confirmCallback = onConfirmAction;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-btn').onclick = function() {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        // טעינת נתונים מ-LocalStorage
        function loadData() {
            const saved = localStorage.getItem('@subs_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.subscriptions = parsed.subscriptions || [];
                state.projects = parsed.projects || [];
                state.wageType = parsed.wageType || 'monthly';
                state.wageAmount = parsed.wageAmount || '12000';
                document.getElementById('wage-amount').value = state.wageAmount;
                updateWageUI();
            }
            fetchRates();
            render();
        }

        function saveData() {
            localStorage.setItem('@subs_data', JSON.stringify({
                subscriptions: state.subscriptions,
                projects: state.projects,
                wageType: state.wageType,
                wageAmount: state.wageAmount
            }));
        }

        async function fetchRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                if (data && data.rates && data.rates.ILS) {
                    state.exchangeRates = {
                        ILS: 1,
                        USD: data.rates.ILS,
                        EUR: data.rates.ILS / data.rates.EUR
                    };
                    render();
                }
            } catch (e) { console.log('Using fallback rates'); }
        }

        function switchTab(tab) {
            state.activeTab = tab;
            ['subs', 'projects', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`nav-${t}`).className = t === tab ? "text-sky-600 font-bold text-sm flex flex-col items-center" : "text-slate-500 font-medium text-sm flex flex-col items-center";
            });
        }

        // מנויים
        function addSubscription() {
            const name = document.getElementById('sub-name').value.trim();
            const price = parseFloat(document.getElementById('sub-price').value);
            const currency = document.getElementById('sub-currency').value;
            const billingCycle = document.getElementById('sub-cycle').value;

            if (!name || isNaN(price)) {
                showConfirm('שגיאה', 'נא להזין שם ומחיר תקינים למנוי', () => {}, 'הבנתי', 'bg-sky-600 hover:bg-sky-700');
                return;
            }

            state.subscriptions.unshift({ id: Date.now().toString(), name, price, currency, billingCycle: billingCycle || 'monthly', active: true, category: 'כללי' });
            document.getElementById('sub-name').value = '';
            document.getElementById('sub-price').value = '';
            saveData();
            render();
        }

        function toggleSub(id) {
            state.subscriptions = state.subscriptions.map(s => s.id === id ? {...s, active: !s.active} : s);
            saveData();
            render();
        }

        function deleteSub(id) {
            showConfirm(
                'מחיקת מנוי',
                'האם אתה בטוח שברצונך למחוק מנוי זה לצמיתות?',
                () => {
                    state.subscriptions = state.subscriptions.filter(s => s.id !== id);
                    saveData();
                    render();
                },
                'מחק מנוי'
            );
        }

        // שכר
        function setWageType(type) {
            state.wageType = type;
            document.getElementById('btn-monthly').className = type === 'monthly' ? "w-full p-2.5 rounded-lg mb-2 text-sm font-bold bg-sky-600 text-white" : "w-full p-2.5 rounded-lg mb-2 text-sm font-bold bg-slate-100 text-slate-700";
            document.getElementById('btn-hourly').className = type === 'hourly' ? "w-full p-2.5 rounded-lg mb-4 text-sm font-bold bg-sky-600 text-white" : "w-full p-2.5 rounded-lg mb-4 text-sm font-bold bg-slate-100 text-slate-700";
            
            const wageLabel = document.getElementById('wage-label');
            if (type === 'monthly') {
                wageLabel.innerText = 'סכום משכורת חודשית (₪) (נטו):';
            } else {
                wageLabel.innerText = 'שכר לשעה (₪) (נטו):';
            }

            saveData();
            render();
        }

        function updateWage(val) {
            state.wageAmount = val;
            saveData();
            render();
        }

        function updateWageUI() {
            setWageType(state.wageType);
        }

        // פרויקטים ודוכנים
        function openProjectModal() { document.getElementById('project-modal').classList.remove('hidden'); }
        function closeProjectModal() { document.getElementById('project-modal').classList.add('hidden'); }
        
        function setProjType(type) {
            state.newProjType = type;
            document.getElementById('proj-type-paid').className = type === 'paid' ? "flex-1 p-2 rounded-lg text-xs font-bold bg-sky-600 text-white" : "flex-1 p-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-700";
            document.getElementById('proj-type-free').className = type === 'free' ? "flex-1 p-2 rounded-lg text-xs font-bold bg-sky-600 text-white" : "flex-1 p-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-700";
        }

        function createProject() {
            const title = document.getElementById('new-proj-title').value.trim();
            if (!title) return;
            state.projects.unshift({ id: Date.now().toString(), title, type: state.newProjType, items: [] });
            document.getElementById('new-proj-title').value = '';
            closeProjectModal();
            saveData();
            render();
        }

        function deleteProject(id) {
            showConfirm(
                'מחיקת דוכן',
                'אזהרה: פעולה זו תמחק את הדוכן ואת כל המכירות והמוצרים שנרשמו בו.',
                () => {
                    state.projects = state.projects.filter(p => p.id !== id);
                    saveData();
                    render();
                },
                'מחק דוכן'
            );
        }

        function addItemToProj(projId) {
            const name = prompt('שם המוצר:');
            if (!name) return;
            const proj = state.projects.find(p => p.id === projId);
            let cost = 0;
            if (proj.type === 'paid') {
                cost = parseFloat(prompt('עלות קנייה כוללת (₪):') || 0);
            }
            const sellPrice = parseFloat(prompt('מחיר מכירה ליחידה (₪):') || 0);

            if (isNaN(sellPrice)) {
                showConfirm('שגיאה', 'נא למלא מחיר מכירה תקין', () => {}, 'הבנתי', 'bg-sky-600 hover:bg-sky-700');
                return;
            }

            proj.items.push({ id: Date.now().toString(), name: name.trim(), cost, sellPrice, soldCount: 0 });
            saveData();
            render();
        }

        function registerSale(projId, itemId) {
            state.projects = state.projects.map(p => {
                if (p.id === projId) {
                    p.items = p.items.map(i => i.id === itemId ? {...i, soldCount: i.soldCount + 1} : i);
                }
                return p;
            });
            saveData();
            render();
        }

        function decreaseSale(projId, itemId, currentCount) {
            if (currentCount <= 0) return;
            showConfirm(
                'הורדת מכירה',
                'האם אתה בטוח שברצונך להפחית יחידה אחת מסך המכירות של מוצר זה?',
                () => {
                    state.projects = state.projects.map(p => {
                        if (p.id === projId) {
                            p.items = p.items.map(i => (i.id === itemId && i.soldCount > 0) ? {...i, soldCount: i.soldCount - 1} : i);
                        }
                        return p;
                    });
                    saveData();
                    render();
                },
                'הפחת מכירה',
                'bg-amber-500 hover:bg-amber-600'
            );
        }

        function removeItem(projId, itemId) {
            showConfirm(
                'מחיקת מוצר',
                'האם אתה בטוח שברצונך למחוק מוצר זה מהפרויקט?',
                () => {
                    state.projects = state.projects.map(p => {
                        if (p.id === projId) p.items = p.items.filter(i => i.id !== itemId);
                        return p;
                    });
                    saveData();
                    render();
                },
                'מחק מוצר'
            );
        }

        // רינדור ממשק המשתמש
        function render() {
            const active = state.subscriptions.filter(s => s.active);
            const cancelled = state.subscriptions.filter(s => !s.active);

            let totalMonthly = 0;
            let totalYearly = 0;

            active.forEach(s => {
                let converted = s.price * (state.exchangeRates[s.currency] || 1);
                if (s.billingCycle === 'yearly') {
                    totalYearly += converted;
                    totalMonthly += converted / 12;
                } else {
                    totalMonthly += converted;
                    totalYearly += converted * 12;
                }
            });

            document.getElementById('total-monthly').innerText = `₪${totalMonthly.toFixed(1)}`;
            document.getElementById('total-yearly').innerText = `₪${totalYearly.toFixed(1)}`;

            let wageNum = parseFloat(state.wageAmount) || 0;
            let impactText = '';
            if (wageNum > 0) {
                if (state.wageType === 'monthly') {
                    let pct = ((totalMonthly / wageNum) * 100).toFixed(1);
                    impactText = `המנויים מהווים ${pct}% מהמשכורת החודשית שלך`;
                } else {
                    let hrs = (totalMonthly / wageNum).toFixed(1);
                    impactText = `אתה עובד ${hrs} שעות בחודש בשביל המנויים`;
                }
            }
            document.getElementById('wage-impact').innerText = impactText;

            // רשימת מנויים פעילים
            document.getElementById('active-subs-title').innerText = `מנויים פעילים (${active.length})`;
            let activeHtml = active.length === 0 ? '<p class="text-slate-400 text-center text-sm">אין מנויים פעילים כרגע.</p>' : '';
            active.forEach(s => {
                let ils = (s.price * (state.exchangeRates[s.currency] || 1)).toFixed(1);
                let symbol = s.currency === 'ILS' ? '₪' : s.currency === 'USD' ? '$' : '€';
                let cycleText = s.billingCycle === 'yearly' ? 'שנתי' : 'חודשי';
                activeHtml += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-slate-800">${s.name}</h4>
                            <p class="text-xs text-slate-500">${s.price} ${symbol} (${cycleText}) ${s.currency !== 'ILS' ? `(~₪${ils})` : ''}</p>
                        </div>
                        <button onclick="toggleSub('${s.id}')" class="bg-sky-100 text-sky-600 px-3 py-1 rounded-full text-xs font-bold">פעיל</button>
                    </div>
                `;
            });
            document.getElementById('active-subs-list').innerHTML = activeHtml;

            // מנויים מבוטלים
            const cancelledContainer = document.getElementById('cancelled-container');
            if (cancelled.length > 0) {
                cancelledContainer.classList.remove('hidden');
                document.getElementById('cancelled-subs-title').innerText = `מנויים מבוטלים / בהפוגה (${cancelled.length})`;
                let cancHtml = '';
                cancelled.forEach(s => {
                    let cycleText = s.billingCycle === 'yearly' ? 'שנתי' : 'חודשי';
                    cancHtml += `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center opacity-60">
                            <div>
                                <h4 class="font-bold text-slate-700 line-through">${s.name} (${cycleText})</h4>
                                <p class="text-xs text-slate-400">לא פעיל כרגע</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="toggleSub('${s.id}')" class="text-sky-600 font-bold text-xs">הפעל מחדש</button>
                                <button onclick="deleteSub('${s.id}')" class="text-red-500 text-xs">מחק</button>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('cancelled-subs-list').innerHTML = cancHtml;
            } else {
                cancelledContainer.classList.add('hidden');
            }

            // פרויקטים ודוכנים
            let projHtml = state.projects.length === 0 ? '<p class="text-slate-400 text-center text-sm">עדיין לא נוצרו פרויקטים או דוכנים.</p>' : '';
            state.projects.forEach(p => {
                let totalCost = p.items.reduce((sum, i) => sum + i.cost, 0);
                let totalRev = p.items.reduce((sum, i) => sum + (i.sellPrice * i.soldCount), 0);
                let net = totalRev - totalCost;

                projHtml += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-sky-800 text-lg">${p.title}</h3>
                                <span class="bg-sky-100 text-sky-600 text-[10px] px-2 py-0.5 rounded">${p.type === 'free' ? 'מכירת חצר / 0₪ עלות' : 'סחורה וקניות'}</span>
                            </div>
                            <button onclick="deleteProject('${p.id}')" class="text-red-500 text-xs">מחק דוכן</button>
                        </div>
                        <div class="flex justify-around bg-slate-50 p-2.5 rounded-xl text-center">
                            <div><span class="text-[10px] text-slate-400 block">הוצאות</span><span class="font-bold text-sm">₪${totalCost}</span></div>
                            <div><span class="text-[10px] text-slate-400 block">הכנסות</span><span class="font-bold text-sm text-sky-600">₪${totalRev}</span></div>
                            <div><span class="text-[10px] text-slate-400 block">רווח נקי</span><span class="font-bold text-sm ${net >= 0 ? 'text-emerald-600' : 'text-red-500'}">₪${net}</span></div>
                        </div>
                        <div class="space-y-2">
                            <p class="text-xs font-bold text-slate-700">מוצרים ומכירה מהירה:</p>
                `;
                if (p.items.length === 0) {
                    projHtml += `<p class="text-slate-400 text-center text-xs my-2">אין מוצרים בדוכן זה עדיין.</p>`;
                }
                p.items.forEach(i => {
                    projHtml += `
                        <div class="bg-sky-50/50 p-2 rounded-lg flex justify-between items-center text-xs">
                            <div class="flex-1">
                                <span class="font-bold text-slate-800 block">${i.name}</span>
                                <span class="text-[10px] text-slate-500">מחיר: ₪${i.sellPrice} | נמכרו: ${i.soldCount} יח'</span>
                            </div>
                            <div class="flex gap-1 items-center">
                                <button onclick="registerSale('${p.id}', '${i.id}')" class="bg-emerald-500 text-white px-2 py-1 rounded font-bold">+ מכירה</button>
                                <button onclick="decreaseSale('${p.id}', '${i.id}', ${i.soldCount})" class="bg-amber-500 text-white px-2 py-1 rounded font-bold ${i.soldCount === 0 ? 'opacity-40' : ''}">- מכירה</button>
                                <button onclick="removeItem('${p.id}', '${i.id}')" class="text-red-500 px-1 font-bold">מחק</button>
                            </div>
                        </div>
                    `;
                });
                projHtml += `
                        </div>
                        <button onclick="addItemToProj('${p.id}')" class="w-full bg-sky-50 text-sky-600 text-xs font-bold py-2 rounded-lg border border-sky-100">+ הוסף מוצר לדוכן</button>
                    </div>
                `;
            });
            document.getElementById('projects-list').innerHTML = projHtml;
        }

        // טעינה ראשונית
        loadData();
    </script>
</body>
</html>
